<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>漢字チャレンジ</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#202638;overscroll-behavior:none}.wrap{max-width:760px;margin:auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:25px}.sub{color:#7d8798;font-size:13px;margin-top:3px}.btn{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:700;background:#eef0f6;color:#252b39;touch-action:manipulation}.primary{background:#5d69f7;color:#fff}.good{background:#e7f8f0;color:#117653}.bad{background:#fff0f0;color:#bd3d3d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#eef1f6;border-radius:15px;padding:8px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#7d8798}.progress{height:7px;background:#e7eaf1;border-radius:999px;margin:11px 0;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#5d69f7}.card{background:#fff;border:1px solid #e3e7ee;border-radius:24px;padding:16px 12px 18px;text-align:center}.reading{font-size:21px;font-weight:700;color:#626a7a;letter-spacing:2px}.word{font-size:42px;font-weight:800;margin:2px 0 4px}.strokeInfo{font-size:14px;color:#6a7280;margin:4px 0 7px}.strokeInfo strong{font-size:18px;color:#4d57ce}.pad{position:relative;width:min(72vw,300px);height:min(72vw,300px);margin:auto;border:3px solid #dfe3eb;border-radius:20px;background:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}.pad:before,.pad:after{content:"";position:absolute;pointer-events:none;opacity:.55;z-index:1}.pad:before{left:50%;top:0;bottom:0;border-left:1px dashed #c4cad5}.pad:after{top:50%;left:0;right:0;border-top:1px dashed #c4cad5}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:2}.padBtns{display:flex;justify-content:center;gap:8px;margin-top:8px}.feedback{display:none;margin-top:10px;padding:11px;border-radius:14px;font-size:15px}.feedback.show{display:block}.feedback.ok{background:#eaf8f2;color:#137452}.feedback.err{background:#fff0f0;color:#b33c3c}.reveal,.teach{display:none;margin-top:12px;padding:14px;border-radius:17px;background:#fff8e9}.reveal.show,.teach.show{display:block}.big{font-size:58px;font-weight:800}.judge{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.small{font-size:12px;color:#777f8d;line-height:1.45}.hidden{display:none!important}.complete{display:none;text-align:center}.complete.show{display:block}.complete .emoji{font-size:65px}.guideNote{font-size:14px;color:#76622d;margin:5px 0 9px}.sticky{position:fixed;z-index:20;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:732px;margin:0 auto;background:rgba(245,247,251,.96);padding:8px;border:1px solid #e2e6ee;border-radius:19px;box-shadow:0 8px 28px rgba(30,40,70,.15);display:grid;grid-template-columns:1fr 1.45fr;gap:8px}.sticky .btn{min-height:50px;font-size:17px}.nextMsg{font-size:18px;font-weight:800;color:#137452;margin-top:8px}@media(max-width:390px){h1{font-size:23px}.pad{width:min(68vw,270px);height:min(68vw,270px)}.word{font-size:38px}}</style></head><body><div class="wrap"><div class="top"><div><h1>漢字チャレンジ</h1><div class="sub">手書きで答えよう。まちがえた漢字は3回れんしゅう。</div></div><button class="btn" id="restartTop">さいしょから</button></div><div class="stats"><div class="stat"><b id="left">0</b><span>のこり</span></div><div class="stat"><b id="right">0</b><span>せいかい</span></div><div class="stat"><b id="wrong">0</b><span>まちがい</span></div></div><div class="progress"><i id="bar"></i></div><section class="card" id="card"><div class="small">□に入る漢字を書こう</div><div class="reading" id="reading">—</div><div class="word" id="word">—</div><div class="strokeInfo">いま <strong id="strokeNow">0</strong> 画</div><div class="pad"><canvas id="canvas"></canvas></div><div class="padBtns"><button class="btn" id="undo">1画もどす</button><button class="btn" id="clear">けす</button></div><div class="feedback" id="feedback"></div><div class="reveal" id="reveal"><div class="small" id="full"></div><div class="big" id="answer"></div><div class="small" id="strokeExpected"></div><div class="judge"><button class="btn bad" id="shapeWrong">かたちがちがう</button><button class="btn good" id="shapeRight">できた！</button></div></div><div class="teach" id="teach"><div class="small">お手本</div><div class="big" id="teachChar"></div><div class="guideNote">うすい漢字をなぞって書こう</div><div class="small" id="practiceMsg"></div><div class="pad" style="margin-top:9px"><canvas id="practice"></canvas></div><div class="strokeInfo">いま <strong id="practiceStroke">0</strong> 画</div><div class="padBtns"><button class="btn" id="practiceUndo">1画もどす</button><button class="btn" id="practiceClear">けす</button><button class="btn primary" id="practiceDone">この1回をおわる</button></div><div class="nextMsg" id="nextMsg"></div></div></section><section class="complete" id="complete"><div class="emoji">🏆</div><h2>ぜんぶできた！</h2><p>よくがんばりました！</p><button class="btn primary" id="restart">もう1回</button></section></div><div class="sticky" id="sticky"><button class="btn" id="hint">ヒント</button><button class="btn primary" id="check">画数をチェック</button></div><script>(()=>{const DATA=`世|世界|せかい|5
全|全部|ぜんぶ|6

童|児童|じどう|12
指|指示|しじ|9
昔|昔話|むかしばなし|8
題|問題|もんだい|18
予|予定|よてい|4
球|野球|やきゅう|11
有|有名|ゆうめい|6
悲|悲しい|かなしい|12
反|反対|はんたい|4
坂|坂道|さかみち|7
仕|仕事|しごと|5
登|登場|とうじょう|12
緑|緑色|みどりいろ|14
村|村人|むらびと|7
助|助ける|たすける|7

路|道路|どうろ|13
氷|氷水|こおりみず|5
鉄|鉄道|てつどう|13
農|農業|のうぎょう|13
館|図書館|としょかん|16
横|横道|よこみち|15
区|地区|ちく|4
感|感想|かんそう|13
安|安全|あんぜん|6
平|平和|へいわ|5
事|仕事|しごと|8
酒|お酒|おさけ|10
温|温度|おんど|12
所|場所|ばしょ|8
次|次回|じかい|6
界|世界|せかい|9
深|深い|ふかい|11
葉|葉っぱ|はっぱ|12
詩|詩集|ししゅう|13
落|落ちる|おちる|12
決|決める|きめる|7
問|問題|もんだい|11
使|使う|つかう|8
味|味見|あじみ|8
動|運動|うんどう|11
進|進む|すすむ|11
始|始める|はじめる|8`;const bank=DATA.split('\n').map(x=>{const[a,b,c,d]=x.split('|');return{char:a,word:b,reading:c,strokes:+d}}),$=id=>document.getElementById(id);let q=[],mastered=new Set(),wrong=new Set(),cur=null,mode='quiz',practiceLeft=3;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makePad(canvas,countEl,guideFn){const ctx=canvas.getContext('2d'),strokes=[];let drawing=false,current=[];function fit(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);redraw()}function redraw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(guideFn){const g=guideFn();if(g){ctx.save();ctx.fillStyle='rgba(93,105,247,.22)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${Math.floor(Math.min(w,h)*.72)}px "Hiragino Mincho ProN","Yu Mincho",serif`;ctx.fillText(g,w/2,h/2+4);ctx.restore()}}ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#202638';for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}countEl.textContent=strokes.length}function p(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function stop(e){if(e.cancelable)e.preventDefault()}canvas.addEventListener('touchstart',stop,{passive:false});canvas.addEventListener('touchmove',stop,{passive:false});canvas.addEventListener('pointerdown',e=>{stop(e);drawing=true;current=[p(e)];try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(!drawing)return;stop(e);current.push(p(e));redraw();if(current.length>1){const s=current;ctx.beginPath();ctx.moveTo(s[s.length-2].x,s[s.length-2].y);ctx.lineTo(s[s.length-1].x,s[s.length-1].y);ctx.stroke()}});function end(e){if(!drawing)return;stop(e);drawing=false;if(current.length===1)current.push({x:current[0].x+.1,y:current[0].y+.1});strokes.push(current);current=[];redraw()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);fit();window.addEventListener('resize',fit);return{clear(){strokes.length=0;redraw()},undo(){strokes.pop();redraw()},count(){return strokes.length},redraw}}const pad=makePad($('canvas'),$('strokeNow')),ppad=makePad($('practice'),$('practiceStroke'),()=>mode==='teach'&&cur?cur.char:'');function stats(){const total=bank.length,done=mastered.size;$('left').textContent=total-done;$('right').textContent=done;$('wrong').textContent=wrong.size;$('bar').style.width=(done/total*100)+'%'}function masked(x){return x.word.replace(x.char,'□')}function next(){if(mastered.size===bank.length){$('card').classList.add('hidden');$('complete').classList.add('show');$('sticky').classList.add('hidden');stats();return}while(q.length&&mastered.has(q[0].char))q.shift();if(!q.length)q=shuffle(bank.filter(x=>!mastered.has(x.char)));cur=q.shift();mode='quiz';$('sticky').classList.remove('hidden');$('reading').textContent=cur.reading;$('word').textContent=masked(cur);$('feedback').className='feedback';$('reveal').classList.remove('show');$('teach').classList.remove('show');$('nextMsg').textContent='';pad.clear();ppad.clear();stats();window.scrollTo(0,0)}function reset(){q=shuffle(bank.slice());mastered.clear();wrong.clear();$('card').classList.remove('hidden');$('complete').classList.remove('show');next()}$('clear').onclick=()=>pad.clear();$('undo').onclick=()=>pad.undo();$('practiceClear').onclick=()=>ppad.clear();$('practiceUndo').onclick=()=>ppad.undo();$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent=`ヒント：ことばは「${cur.word}」`};$('check').onclick=()=>{if(mode!=='quiz')return;const n=pad.count();if(!n){$('feedback').className='feedback show err';$('feedback').textContent='まず漢字を書いてね。';return}if(n!==cur.strokes){wrong.add(cur.char);$('feedback').className='feedback show err';$('feedback').textContent=`画数がちがうよ。${n}画ではなく、${cur.strokes}画です。3回れんしゅうしよう。`;startTeach();stats();return}$('feedback').className='feedback show ok';$('feedback').textContent=`画数はせいかい！ ${cur.strokes}画です。`;$('answer').textContent=cur.char;$('full').textContent=`${cur.word}（${cur.reading}）`;$('strokeExpected').textContent=`正しい画数：${cur.strokes}画`;$('reveal').classList.add('show');mode='judge';$('reveal').scrollIntoView({behavior:'smooth',block:'center'})};function startTeach(){mode='teach';practiceLeft=3;$('sticky').classList.add('hidden');$('reveal').classList.remove('show');$('teach').classList.add('show');$('teachChar').textContent=cur.char;$('practiceMsg').textContent=`うすい「${cur.char}」をなぞろう。あと3回。`;ppad.clear();ppad.redraw();$('teach').scrollIntoView({behavior:'smooth',block:'start'})}$('shapeWrong').onclick=()=>{wrong.add(cur.char);startTeach();stats()};$('shapeRight').onclick=()=>{mastered.add(cur.char);wrong.delete(cur.char);$('feedback').className='feedback show ok';$('feedback').textContent='できた！ つぎのもんだいへ。';stats();setTimeout(next,650)};$('practiceDone').onclick=()=>{const n=ppad.count();if(n!==cur.strokes){$('practiceMsg').textContent=`いまは${n}画。正しくは${cur.strokes}画です。もう一度書こう。`;ppad.clear();return}practiceLeft--;ppad.clear();if(practiceLeft>0){$('practiceMsg').textContent=`できた！ あと${practiceLeft}回。`}else{$('nextMsg').textContent='れんしゅうできた！ つぎのもんだいへ。';const pos=Math.min(q.length,3+Math.floor(Math.random()*3));q.splice(pos,0,cur);setTimeout(next,850)}};$('restart').onclick=reset;$('restartTop').onclick=reset;reset()})();</script></body></html>
