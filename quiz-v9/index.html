<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>漢字チャレンジ</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#202638;overscroll-behavior:none}.wrap{max-width:760px;margin:auto;padding:14px 14px 110px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:25px;font-weight:800}.sub{font-size:13px;color:#7d8798;margin-top:3px}.btn{border:0;border-radius:14px;padding:12px 15px;font-size:15px;font-weight:700;background:#eef0f6;color:#252b39}.primary{background:#5d69f7;color:#fff}.good{background:#e7f8f0;color:#117653}.bad{background:#fff0f0;color:#bd3d3d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#eef1f6;border-radius:15px;padding:8px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#7d8798}.bar{height:7px;background:#e7eaf1;border-radius:999px;margin:11px 0;overflow:hidden}.bar i{display:block;height:100%;background:#5d69f7}.card{background:#fff;border:1px solid #e3e7ee;border-radius:24px;padding:16px 12px;text-align:center}.small{font-size:12px;color:#777f8d}.reading{font-size:21px;font-weight:700;color:#626a7a;letter-spacing:2px}.word{font-size:42px;font-weight:800;margin:2px 0 4px}.stroke{font-size:14px;color:#6a7280;margin:5px 0 8px}.stroke strong{font-size:18px;color:#4d57ce}.pad{position:relative;width:min(72vw,300px);height:min(72vw,300px);margin:auto;border:3px solid #dfe3eb;border-radius:20px;background:#fff;overflow:hidden;touch-action:none}.pad:before,.pad:after{content:"";position:absolute;z-index:1;pointer-events:none;opacity:.55}.pad:before{left:50%;top:0;bottom:0;border-left:1px dashed #c4cad5}.pad:after{top:50%;left:0;right:0;border-top:1px dashed #c4cad5}.guide{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:min(54vw,225px);color:rgba(93,105,247,.24);pointer-events:none}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none}.padBtns{display:flex;justify-content:center;gap:8px;margin-top:8px}.feedback{margin-top:10px;padding:11px;border-radius:14px;font-size:15px;display:none}.feedback.show{display:block}.feedback.ok{background:#eaf8f2;color:#137452}.feedback.err{background:#fff0f0;color:#b33c3c}.answer,.practice{display:none;margin-top:12px;padding:14px;border-radius:17px;background:#fff8e9}.answer.show,.practice.show{display:block}.big{font-size:58px;font-weight:800}.judge{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}.sticky{position:fixed;left:12px;right:12px;bottom:10px;max-width:732px;margin:auto;z-index:20;background:rgba(245,247,251,.97);padding:8px;border:1px solid #e2e6ee;border-radius:19px;display:grid;grid-template-columns:1fr 1.45fr;gap:8px;box-shadow:0 8px 28px rgba(30,40,70,.15)}.sticky .btn{min-height:50px;font-size:17px}.hidden{display:none!important}.done{text-align:center;padding:40px 10px;display:none}.done.show{display:block}@media(max-width:390px){.pad{width:min(68vw,270px);height:min(68vw,270px)}.guide{font-size:min(50vw,200px)}.word{font-size:38px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">漢字チャレンジ</div><div class="sub">手書きで答えよう。まちがえた漢字は3回れんしゅう。</div></div><button class="btn" id="restartTop">さいしょから</button></div><div class="stats"><div class="stat"><b id="left">0</b><span>のこり</span></div><div class="stat"><b id="right">0</b><span>せいかい</span></div><div class="stat"><b id="wrong">0</b><span>まちがい</span></div></div><div class="bar"><i id="progress"></i></div><section class="card" id="card"><div class="small">□に入る漢字を書こう</div><div class="reading" id="reading"></div><div class="word" id="word"></div><div class="stroke">いま <strong id="count">0</strong> 画</div><div class="pad"><canvas id="mainCanvas"></canvas></div><div class="padBtns"><button class="btn" id="undo">1画もどす</button><button class="btn" id="clear">けす</button></div><div id="feedback" class="feedback"></div><div id="answerBox" class="answer"><div class="small" id="fullWord"></div><div class="big" id="answerChar"></div><div class="small" id="expected"></div><div class="judge"><button class="btn bad" id="shapeBad">かたちがちがう</button><button class="btn good" id="shapeGood">できた！</button></div></div><div id="practiceBox" class="practice"><div class="small">お手本</div><div class="big" id="teachChar"></div><div style="margin:5px 0 8px;color:#76622d">うすい漢字をなぞって書こう</div><div class="small" id="practiceMsg"></div><div class="pad" style="margin-top:9px"><canvas id="practiceCanvas"></canvas><div class="guide" id="guide"></div></div><div class="stroke">いま <strong id="practiceCount">0</strong> 画</div><div class="padBtns"><button class="btn" id="pUndo">1画もどす</button><button class="btn" id="pClear">けす</button><button class="btn primary" id="pDone">この1回をおわる</button></div></div></section><section id="done" class="done"><div style="font-size:70px">🏆</div><h2>ぜんぶできた！</h2><p>よくがんばりました！</p><button class="btn primary" id="restart">もう1回</button></section></div><div id="sticky" class="sticky"><button class="btn" id="hint">ヒント</button><button class="btn primary" id="check">画数をチェック</button></div><script>(()=>{const DATA=`世|世界|せかい|5
全|全部|ぜんぶ|6
練|練習|れんしゅう|14
住|住所|じゅうしょ|7
面|面積|めんせき|9

定|予定|よてい|8
部|部分|ぶぶん|11
秒|秒針|びょうしん|9
服|洋服|ようふく|8
景|景色|けしき|12
童|児童|じどう|12
指|指示|しじ|9
昔|昔話|むかしばなし|8
題|問題|もんだい|18
予|予定|よてい|4
球|野球|やきゅう|11
有|有名|ゆうめい|6
悲|悲しい|かなしい|12
反|反対|はんたい|4
坂|坂道|さかみち|7
仕|仕事|しごと|5
登|登場|とうじょう|12
緑|緑色|みどりいろ|14
村|村人|むらびと|7
助|助ける|たすける|7
岸|海岸|かいがん|8
路|道路|どうろ|13
氷|氷水|こおりみず|5
鉄|鉄道|てつどう|13
農|農業|のうぎょう|13
館|図書館|としょかん|16
横|横道|よこみち|15
区|地区|ちく|4
感|感想|かんそう|13
安|安全|あんぜん|6
平|平和|へいわ|5
事|仕事|しごと|8
酒|お酒|おさけ|10
温|温度|おんど|12
所|場所|ばしょ|8
次|次回|じかい|6
界|世界|せかい|9
深|深い|ふかい|11
葉|葉っぱ|はっぱ|12
詩|詩集|ししゅう|13
落|落ちる|おちる|12
決|決める|きめる|7
問|問題|もんだい|11
使|使う|つかう|8
味|味見|あじみ|8
動|運動|うんどう|11
進|進む|すすむ|11
始|始める|はじめる|8`;const bank=DATA.split('\n').map(s=>{const[a,b,c,d]=s.split('|');return{char:a,word:b,reading:c,strokes:+d}}),$=id=>document.getElementById(id);let queue=[],cur=null,mastered=new Set(),wrong=new Set(),mode='quiz',leftPractice=3;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makePad(canvas,countEl){let strokes=[],drawing=false,current=[];const ctx=canvas.getContext('2d');function fit(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);redraw()}function redraw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#202638';for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0].x,s[0].y);for(let i=1;i<s.length;i++)ctx.lineTo(s[i].x,s[i].y);ctx.stroke()}countEl.textContent=strokes.length}function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function prevent(e){if(e.cancelable)e.preventDefault()}canvas.addEventListener('touchstart',prevent,{passive:false});canvas.addEventListener('touchmove',prevent,{passive:false});canvas.addEventListener('pointerdown',e=>{prevent(e);drawing=true;current=[pos(e)];try{canvas.setPointerCapture(e.pointerId)}catch(_){}});canvas.addEventListener('pointermove',e=>{if(!drawing)return;prevent(e);current.push(pos(e));redraw();const n=current.length;if(n>1){ctx.beginPath();ctx.moveTo(current[n-2].x,current[n-2].y);ctx.lineTo(current[n-1].x,current[n-1].y);ctx.stroke()}});function end(e){if(!drawing)return;prevent(e);drawing=false;if(current.length===1)current.push({x:current[0].x+.1,y:current[0].y+.1});strokes.push(current);current=[];redraw()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);return{fit,clear(){strokes=[];redraw()},undo(){strokes.pop();redraw()},count(){return strokes.length}}}const mainPad=makePad($('mainCanvas'),$('count')),practicePad=makePad($('practiceCanvas'),$('practiceCount'));function stats(){const d=mastered.size;$('left').textContent=bank.length-d;$('right').textContent=d;$('wrong').textContent=wrong.size;$('progress').style.width=(d/bank.length*100)+'%'}function masked(x){return x.word.replace(x.char,'□')}function next(){if(mastered.size===bank.length){$('card').classList.add('hidden');$('done').classList.add('show');$('sticky').classList.add('hidden');return}while(queue.length&&mastered.has(queue[0].char))queue.shift();if(!queue.length)queue=shuffle(bank.filter(x=>!mastered.has(x.char)));cur=queue.shift();mode='quiz';$('reading').textContent=cur.reading;$('word').textContent=masked(cur);$('feedback').className='feedback';$('answerBox').classList.remove('show');$('practiceBox').classList.remove('show');$('sticky').classList.remove('hidden');mainPad.fit();mainPad.clear();stats();window.scrollTo(0,0)}function reset(){mastered.clear();wrong.clear();queue=shuffle(bank.slice());$('card').classList.remove('hidden');$('done').classList.remove('show');next()}$('undo').onclick=()=>mainPad.undo();$('clear').onclick=()=>mainPad.clear();$('pUndo').onclick=()=>practicePad.undo();$('pClear').onclick=()=>practicePad.clear();$('hint').onclick=()=>{$('feedback').className='feedback show';$('feedback').textContent=`ヒント：ことばは「${cur.word}」`};function startPractice(){mode='practice';leftPractice=3;$('sticky').classList.add('hidden');$('answerBox').classList.remove('show');$('practiceBox').classList.add('show');$('teachChar').textContent=cur.char;$('guide').textContent=cur.char;$('practiceMsg').textContent=`「${cur.char}」をなぞろう。あと3回。`;requestAnimationFrame(()=>{practicePad.fit();practicePad.clear();$('practiceBox').scrollIntoView({behavior:'smooth',block:'start'})})}$('check').onclick=()=>{if(mode!=='quiz')return;const n=mainPad.count();if(!n){$('feedback').className='feedback show err';$('feedback').textContent='まず漢字を書いてね。';return}if(n!==cur.strokes){wrong.add(cur.char);$('feedback').className='feedback show err';$('feedback').textContent=`画数がちがうよ。${n}画ではなく、${cur.strokes}画です。`;stats();startPractice();return}$('feedback').className='feedback show ok';$('feedback').textContent=`画数はせいかい！ ${cur.strokes}画です。`;$('fullWord').textContent=`${cur.word}（${cur.reading}）`;$('answerChar').textContent=cur.char;$('expected').textContent=`正しい画数：${cur.strokes}画`;$('answerBox').classList.add('show');mode='judge';$('answerBox').scrollIntoView({behavior:'smooth',block:'center'})};$('shapeBad').onclick=()=>{wrong.add(cur.char);stats();startPractice()};$('shapeGood').onclick=()=>{mastered.add(cur.char);wrong.delete(cur.char);stats();$('feedback').className='feedback show ok';$('feedback').textContent='できた！ つぎのもんだいへ。';setTimeout(next,650)};$('pDone').onclick=()=>{const n=practicePad.count();if(n!==cur.strokes){$('practiceMsg').textContent=`いまは${n}画。正しくは${cur.strokes}画です。もう一度。`;practicePad.clear();return}leftPractice--;practicePad.clear();if(leftPractice>0){$('practiceMsg').textContent=`できた！ あと${leftPractice}回。`}else{const pos=Math.min(queue.length,3+Math.floor(Math.random()*3));queue.splice(pos,0,cur);$('practiceMsg').textContent='れんしゅうできた！ つぎのもんだいへ。';setTimeout(next,700)}};$('restart').onclick=reset;$('restartTop').onclick=reset;reset()})();</script></body></html>
