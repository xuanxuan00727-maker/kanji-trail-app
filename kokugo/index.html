<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>小3国語</title><style>body{margin:0;background:#f8f1f5;font-family:-apple-system,"Yu Gothic",sans-serif;color:#30242b}main{max-width:900px;margin:auto;padding:14px}header,.box{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #61324a18}header{background:linear-gradient(135deg,#b9416b,#dc829e);color:#fff}h1{margin:0 0 6px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button{font:inherit}.lesson,.choice,.btn{border:0;border-radius:13px;padding:13px}.lesson{background:#f4e8ed;text-align:left}.lesson.on{outline:3px solid #c64e77;background:#fff0f5}.lesson b{display:block}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.btn{font-weight:800}.go{background:#c64e77;color:#fff}.sub{background:#eee5e9}.q{font-size:22px;line-height:1.65;font-weight:800}.choices{display:grid;gap:10px;margin-top:15px}.choice{text-align:left;background:#fff;border:2px solid #e2d1d8;font-size:18px}.ok{background:#eaf8ef!important;border-color:#16803c!important}.ng{background:#fff0f0!important;border-color:#c62828!important}.hide{display:none}.exp{background:#faf6f8;border-radius:12px;padding:13px;margin-top:12px;line-height:1.6}.bar{height:11px;background:#eadfe4;border-radius:9px;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:#c64e77}.score{font-size:56px;text-align:center;color:#c64e77;font-weight:900}.rev{padding:10px;border-left:6px solid #ccc;margin:8px 0;background:#fffafd}.rev.ok{border-color:#16803c}.rev.ng{border-color:#c62828}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}.q{font-size:20px}}</style><main><header><h1>小学（しょうがく）3年生（ねんせい）国語（こくご）</h1>第（だい）5〜10回（かい）・自動（じどう）採点（さいてん）</header><section id=s class=box><h2>回（かい）を選（えら）ぶ</h2><div id=g class=grid></div><div class=row><button class="btn go" onclick=start()>スタート</button><button class="btn sub" onclick="sel=new Set([5,6,7,8,9,10]);draw()">全部（ぜんぶ）</button><button class="btn sub" onclick="sel.clear();draw()">消（け）す</button></div></section><section id=q class="box hide"><b id=m></b><div id=t class=q></div><div id=c class=choices></div><div id=e class="exp hide"></div><div class=bar><i id=b></i></div><div class=row><button id=n class="btn go hide" onclick=next()>次（つぎ）</button><button class="btn sub" onclick=home()>中断（ちゅうだん）</button></div></section><section id=r class="box hide"><div id=sc class=score></div><h2 id=rt style="text-align:center"></h2><p id=sm style="text-align:center"></p><div class=row><button class="btn go" onclick=retry()>まちがい直（なお）し</button><button class="btn sub" onclick=home()>選（えら）び直（なお）す</button></div><div id=rv></div></section><script>const L={5:'説明文・慣用句',6:'物語文・ことば',7:'物語文・熟語',8:'四字熟語',9:'ことわざ',10:'説明文・慣用句'},Q=[];const A=(l,k,q,a,e)=>Q.push({l,k,q,a,e});A(5,'説明文','書（か）き始（はじ）めを一字分（いちじぶん）下（さ）げた文章（ぶんしょう）のまとまりは？','形式段落（けいしきだんらく）','形式段落です');A(5,'説明文','段落（だんらく）で筆者（ひっしゃ）が最（もっと）も伝（つた）えたい内容（ないよう）は？','要点（ようてん）','大切な内容が要点です');A(5,'説明文','文章（ぶんしょう）の最後（さいご）のまとめは？','結論（けつろん）','最後のまとめが結論です');[['目（め）を丸（まる）くする','とても驚（おどろ）く'],['目（め）を細（ほそ）める','うれしそうにほほえむ'],['目（め）が回（まわ）る','とても忙（いそが）しい'],['耳（みみ）が痛（いた）い','弱点（じゃくてん）を言（い）われてつらい'],['猫（ねこ）をかぶる','本性（ほんしょう）をかくしておとなしく見（み）せる'],['水（みず）に流（なが）す','過去（かこ）のことを問題（もんだい）にしない'],['顔（かお）が広（ひろ）い','知（し）り合（あ）いが多（おお）い']].forEach(x=>A(5,'慣用句','「'+x[0]+'」の意味（いみ）は？',x[1],x[1]+'ことです'));A(6,'物語文','人物（じんぶつ）の気持（きも）ちを読（よ）む手（て）がかりは？','行動（こうどう）や会話（かいわ）','行動・会話・表情が手がかりです');A(6,'物語文','気持（きも）ちが変（か）わった理由（りゆう）を考（かんが）えるときは？','その前（まえ）のできごとを確（たし）かめる','きっかけを探します');A(6,'ことば','「白（しろ）い花（はな）が庭（にわ）に咲（さ）く」の主語（しゅご）は？','白（しろ）い花（はな）が','何が、に当たる部分です');A(6,'ことば','同（おな）じ文（ぶん）の述語（じゅつご）は？','咲（さ）く','どうする、に当たる部分です');A(6,'ことば','「大（おお）きな犬（いぬ）」で犬をくわしくする言葉は？','大（おお）きな','修飾語です');A(6,'熟語','「国（くに）が立（た）てる」という関係の熟語は？','国立（こくりつ）','主語・述語の関係です');A(6,'熟語','「親（した）しい友（とも）」という関係の熟語は？','親友（しんゆう）','上の漢字が下を説明します');A(7,'物語文','気持（きも）ちの動（うご）きを読（よ）む順番（じゅんばん）は？','できごと→気持（きも）ち→反応（はんのう）','この順番で追います');A(7,'物語文','「肩（かた）を落（お）とす」から分かる気持ちは？','がっかりしている','失望を表します');A(7,'熟語','似（に）た意味（いみ）の漢字を組み合わせた熟語は？','温暖（おんだん）','温と暖は似た意味です');A(7,'熟語','反対（はんたい）の意味の漢字を組み合わせた熟語は？','寒暖（かんだん）','寒と暖は反対です');A(7,'熟語','「書（しょ）を読（よ）む」という関係の熟語は？','読書（どくしょ）','下の漢字が目的を表します');[['意気投合（いきとうごう）','気持（きも）ちや考（かんが）えがぴったり合（あ）う'],['一部始終（いちぶしじゅう）','最初（さいしょ）から最後（さいご）まで全部（ぜんぶ）'],['温故知新（おんこちしん）','昔（むかし）を学（まな）び新（あたら）しい知識（ちしき）を得（え）る'],['我田引水（がでんいんすい）','自分（じぶん）に都合（つごう）よく考（かんが）える'],['完全無欠（かんぜんむけつ）','欠点（けってん）がまったくない'],['前代未聞（ぜんだいみもん）','今（いま）まで聞（き）いたことがないほど珍（めずら）しい'],['大器晩成（たいきばんせい）','大（おお）きな才能（さいのう）が後（あと）になって実（みの）る'],['日進月歩（にっしんげっぽ）','日々（ひび）たえず進歩（しんぽ）する'],['付和雷同（ふわらいどう）','自分の考えをもたず人に合わせる'],['臨機応変（りんきおうへん）','その場（ば）に合（あ）わせて適切（てきせつ）に行動（こうどう）する']].forEach(x=>A(8,'四字熟語','「'+x[0]+'」の意味は？',x[1],x[1]+'ことです'));[['石橋（いしばし）をたたいて渡（わた）る','用心（ようじん）に用心を重（かさ）ねる'],['鬼（おに）に金棒（かなぼう）','強（つよ）いものがさらに強くなる'],['溺（おぼ）れる者（もの）はわらをもつかむ','危険（きけん）が迫（せま）ると頼れないものにもすがる'],['弘法（こうぼう）にも筆（ふで）の誤（あやま）り','名人（めいじん）でも失敗することがある'],['転（ころ）ばぬ先（さき）の杖（つえ）','失敗しないよう前もって準備する'],['提灯（ちょうちん）に釣（つ）り鐘（がね）','比（くら）べものにならないほど差がある'],['塵（ちり）も積（つ）もれば山となる','小さなことも積み重なれば大きくなる'],['時（とき）は金（かね）なり','時間は貴重である'],['長（なが）い物（もの）には巻（ま）かれろ','強い相手には従うほうがよい']].forEach(x=>A(9,'ことわざ','「'+x[0]+'」の意味は？',x[1],x[1]+'という意味です'));A(10,'説明文','文章全体（ぶんしょうぜんたい）で筆者が最も伝えたいことは？','要旨（ようし）','文章全体の中心が要旨です');[['猫（ねこ）の手（て）も借（か）りたい','とても忙しく、だれでもよいから手伝ってほしい'],['青菜（あおな）に塩（しお）','元気がなく、しおれている'],['鵜（う）のみ','よく考えず、そのまま信じる'],['瓜（うり）二（ふた）つ','顔や姿がとてもよく似ている'],['虫（むし）の居所（いどころ）が悪（わる）い','機嫌（きげん）が悪い'],['虫（むし）が知（し）らせる','なんとなく悪い予感がする'],['狐（きつね）につままれる','意外なことにあっけにとられる'],['袋（ふくろ）のねずみ','逃げ出せない状態'],['猫（ねこ）を被（かぶ）る','本性をかくしておとなしく見せる']].forEach(x=>A(10,'慣用句','「'+x[0]+'」の意味は？',x[1],x[1]+'ことです'));let sel=new Set([5,6,7,8,9,10]),items=[],idx=0,ans=[],lock=0;const $=x=>document.getElementById(x),mix=a=>[...a].sort(()=>Math.random()-.5);function opts(a){return mix([a,'文字（もじ）どおりの意味','とても楽（たの）しい','何（なに）もしなくてよい'])}function draw(){g.innerHTML='';Object.keys(L).forEach(k=>{let x=document.createElement('button');x.className='lesson'+(sel.has(+k)?' on':'');x.innerHTML='<b>第'+k+'回</b><small>'+L[k]+'</small>';x.onclick=()=>{sel.has(+k)?sel.delete(+k):sel.add(+k);draw()};g.appendChild(x)})}function start(list){items=list||mix(Q.filter(x=>sel.has(x.l)));if(!items.length)return alert('回を選んでください');idx=0;ans=[];s.classList.add('hide');r.classList.add('hide');q.classList.remove('hide');show()}function show(){lock=0;let x=items[idx],o=opts(x.a);m.textContent='第'+x.l+'回・'+x.k+'　'+(idx+1)+' / '+items.length;t.textContent=x.q;c.innerHTML='';e.classList.add('hide');n.classList.add('hide');o.forEach(v=>{let z=document.createElement('button');z.className='choice';z.textContent=v;z.onclick=()=>pick(v,z,o);c.appendChild(z)});b.style.width=idx/items.length*100+'%'}function pick(v,z,o){if(lock)return;lock=1;ans[idx]=v;[...c.children].forEach((x,i)=>{x.disabled=1;if(o[i]===items[idx].a)x.classList.add('ok')});if(v!==items[idx].a)z.classList.add('ng');e.textContent=(v===items[idx].a?'正解！ ':'おしい！ ')+items[idx].e;e.classList.remove('hide');n.classList.remove('hide')}function next(){if(++idx<items.length)show();else done()}function done(){q.classList.add('hide');r.classList.remove('hide');let good=items.filter((x,i)=>ans[i]===x.a).length,p=Math.round(good/items.length*100);sc.textContent=p+'点';rt.textContent=p>=90?'すばらしい！':p>=75?'よくできました！':'まちがい直しをしよう';sm.textContent=items.length+'問のうち '+good+'問正解';rv.innerHTML='';items.forEach((x,i)=>{let d=document.createElement('div'),ok=ans[i]===x.a;d.className='rev '+(ok?'ok':'ng');d.innerHTML='<b>'+x.q+'</b><br>あなたの答え：'+ans[i]+'<br>正解：'+x.a+'<br>'+x.e;rv.appendChild(d)})}function retry(){start(items.filter((x,i)=>ans[i]!==x.a))}function home(){q.classList.add('hide');r.classList.add('hide');s.classList.remove('hide')}draw();</script>
